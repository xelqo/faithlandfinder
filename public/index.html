<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F5FF" />
  <title>Faith Land Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <!-- LIST: sites to call this month -->
    <section id="home" class="screen active">
      <header class="top">
        <div class="brand">⛪ Faith Land Finder</div>
      </header>
      <p class="lede">Church land that state law (SB 4) now lets become <b>100% affordable homes</b>, ranked, with every fact sourced.</p>

      <div class="stats" id="stats"></div>

      <div id="map" class="map"></div>
      <div class="legend-map"><span class="lg ranked"></span>Santa Ana: every place of worship scanned &nbsp; <span class="lg live"></span>Orange County: check any address</div>

      <form class="search" id="searchForm">
        <input id="addr" placeholder="Check any address, e.g. 1010 N Tustin Ave, Santa Ana, CA" autocomplete="street-address" />
        <input id="nm" placeholder="Congregation name (optional)" />
        <button class="btn" type="submit">Check this site</button>
      </form>

      <h2 class="section-title">Sites to call this month</h2>
      <p class="muted" id="listNote"></p>
      <ol class="list" id="list"></ol>
    </section>

    <!-- REPORT CARD for one site -->
    <section id="site" class="screen">
      <header class="top">
        <button class="chip ghost" id="backBtn">← All sites</button>
        <span class="live" id="liveTag" hidden>LIVE CHECK</span>
      </header>
      <div id="siteBody"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
